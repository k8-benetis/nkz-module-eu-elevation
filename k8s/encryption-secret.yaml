---
# Reference only — the actual secret is created with kubectl:
#   python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" | xargs -I{} kubectl -n nekazari create secret generic elevation-encryption-secret --from-literal=encryption-key={}
#
# NEVER commit the real key to version control.
apiVersion: v1
kind: Secret
metadata:
  name: elevation-encryption-secret
  namespace: nekazari
  labels:
    app: eu-elevation
    module: eu-elevation
type: Opaque
